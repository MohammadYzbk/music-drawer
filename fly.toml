app = "music-drawer"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  QUEUES_FILE = "/data/queues.json"
  PROTOCOL_HEADER = "x-forwarded-proto"
  HOST_HEADER = "host"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "music_drawer_data"
  destination = "/data"
